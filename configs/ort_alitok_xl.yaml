experiment:
    name: "ort_alitok_xl"
    output_dir: "outputs/ort_alitok_xl"
    generator_checkpoint: ""
    max_train_examples: 1_281_167
    save_every: 10_000
    eval_every: 50_000
    generate_every: 5_000
    log_every: 100
    log_grad_norm_every: 100
    resume: True

model:
    tokenizer:
          type: alitok
          weight_path: ""
    vq_model:
          codebook_size:  4096
          token_size: 32
          num_latent_tokens: 273

    generator:
        type: ort
        hidden_size: 1280
        num_hidden_layers: 32
        num_attention_heads: 16 
        dropout: 0.1
        attn_drop: 0.1
        tok_dropout: 0.1
        class_label_dropout: 0.1
        image_seq_len:  273  
        condition_num_classes: 1000

        # sampling hyper-params
        randomize_temperature: 1.0
        guidance_scale: 10
        guidance_scale_pow: 2.5
        use_soft_cfg: False
        internal_guidance_scale: 2
        softcfg_strength: -1
        step_norm: False
        use_checkpoint: False # True to save memory 
        seed: 2

        randomness_anneal_start: 62500 # 100 epoch
        randomness_anneal_end: 125000 # 200 epochs
    loss:
        type: 'ort_ar_loss'
        # params to control the training weight for different tokens
        alpha_weight_random: 0.75
        beta_weight_random: 1.25

        alpha_weight_raster_start: 1
        beta_weight_raster_start: 1

        alpha_weight_raster_end: 1
        beta_weight_raster_end: 1

        weight_anneal_start: 0
        weight_anneal_end: 0

dataset:
    params:
        # use pretokenized dataset for speed-up
        pretokenization: "path/to/pretokenized_imagenet"
        num_workers_per_gpu: 12
    preprocessing:
        resize_shorter_edge: 256
        crop_size: 256
        random_crop: False
        random_flip: True

optimizer:
    name: adamw 
    params:
        learning_rate: 4e-4
        beta1: 0.9
        beta2: 0.96
        weight_decay: 0.03

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 62_500 # 100 epochs with bsz 2048
        end_lr: 1e-5

training:
    gradient_accumulation_steps: 1
    per_gpu_batch_size: 64  #per GPU, total batch size 2048
    mixed_precision: "bf16"
    enable_tf32: True
    use_ema: False
    seed: 42
    max_train_steps: 187_500 # 187_500 =300epochs, 250_000=400 epochs
    max_grad_norm: 1.0
    torch_compile: False
