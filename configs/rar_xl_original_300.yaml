experiment:
  project: rar_generation
  name: rar_xl_original_300
  max_train_examples: 1281167
  save_every: 50000
  eval_every: 50000
  generate_every: 5000
  log_every: 50
  log_grad_norm_every: 1000
  resume: true
  output_dir: outputs/rar_xl_original_300
model:
  vq_model:
    codebook_size: 1024
    token_size: 256
    num_latent_tokens: 256
    finetune_decoder: false
    pretrained_tokenizer_weight: maskgit-vqgan-imagenet-f16-256.bin
  generator:
    hidden_size: 1280
    num_hidden_layers: 32
    num_attention_heads: 16
    intermediate_size: 5120
    dropout: 0.1
    attn_drop: 0.1
    class_label_dropout: 0.1
    image_seq_len: 256
    condition_num_classes: 1000
    randomize_temperature: 1.0
    guidance_scale: 16.0
    guidance_scale_pow: 2.75
    use_checkpoint: false
    randomness_anneal_start: 62500
    randomness_anneal_end: 125000
    type: rar_original
  tokenizer:
    type: maskgit
    weight_path: ''
dataset:
  params:
    pretokenization: /path/to/pretokenized_dataset
    train_shards_path_or_url: imagenet_sharded/train/imagenet-train-{0000..0252}.tar
    eval_shards_path_or_url: imagenet_sharded/val/imagenet-val-{0000..0009}.tar
    num_workers_per_gpu: 12
  preprocessing:
    resize_shorter_edge: 256
    crop_size: 256
    random_crop: false
    random_flip: true
optimizer:
  name: adamw
  params:
    learning_rate: 0.0004
    beta1: 0.9
    beta2: 0.96
    weight_decay: 0.03
lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 62500
    end_lr: 1.0e-05
training:
  gradient_accumulation_steps: 1
  per_gpu_batch_size: 64
  mixed_precision: bf16
  enable_tf32: true
  enable_wandb: false
  use_ema: false
  seed: 42
  max_train_steps: 187500
  max_grad_norm: 1.0
  global_batch_size: 2048
  torch_compile: false
